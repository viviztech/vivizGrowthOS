[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "viviz-growthos-api"
version = "0.1.0"
description = "Adaptive tenant and module API for VIVIZ GrowthOS"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.16,<2",
  "asyncpg>=0.30,<1",
  "email-validator>=2.2,<3",
  "fastapi==0.142.1",
  "httpx>=0.28,<1",
  "pydantic-settings>=2.10,<3",
  "pwdlib[argon2]>=0.3,<1",
  "PyJWT>=2.10,<3",
  "redis>=6,<7",
  "sqlalchemy==2.0.54",
  "uvicorn[standard]>=0.35,<1"
]

[project.optional-dependencies]
dev = [
  "aiosqlite>=0.21,<1",
  "pytest>=8.4,<10",
  "pytest-asyncio>=1.1,<2",
  "ruff>=0.12,<1"
]

[tool.hatch.build.targets.wheel]
packages = ["growthos"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
